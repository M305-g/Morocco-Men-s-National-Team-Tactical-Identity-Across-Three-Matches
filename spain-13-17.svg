<svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2c200"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="520" height="520" fill="#ffffff"/>
  <text x="260" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Morocco vs Spain, 13:17: individual run on the counter</text>

  <rect x="10" y="40" width="500" height="440" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/>
  <rect x="140" y="40" width="240" height="110" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="215" y="40" width="90" height="35" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="240" y="33" width="40" height="7" fill="#ffffff"/>
  <line x1="10" y1="440" x2="510" y2="440" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="434" text-anchor="end" font-size="12" fill="#ffffff">halfway line</text>

  <!-- Spain goalkeeper -->
  <circle cx="260" cy="62" r="11" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Spain defensive line around the middle -->
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="130" cy="395" r="11"/><circle cx="215" cy="395" r="11"/><circle cx="305" cy="395" r="11"/><circle cx="395" cy="395" r="11"/>
  </g>
  <text x="260" y="365" text-anchor="middle" font-size="12" fill="#ffffff">Spain's defensive line around the middle of the pitch</text>
  <text x="215" y="422" text-anchor="middle" font-size="11" fill="#ffffff">beaten</text>
  <text x="305" y="422" text-anchor="middle" font-size="11" fill="#ffffff">beaten</text>

  <!-- Teammates far from the ball carrier -->
  <g fill="#c1272d" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" opacity="0.75">
    <circle cx="90" cy="300" r="11"/><circle cx="450" cy="280" r="11"/>
  </g>
  <text x="90" y="328" text-anchor="middle" font-size="11" fill="#ffffff">no teammate</text>
  <text x="90" y="341" text-anchor="middle" font-size="11" fill="#ffffff">close by</text>

  <!-- Attacker run -->
  <circle cx="260" cy="465" r="12" fill="#f2c200" stroke="#ffffff" stroke-width="2"/>
  <path d="M260,452 C 262,400 258,330 255,250 C 252,200 258,170 262,140" stroke="#f2c200" stroke-width="4" fill="none" marker-end="url(#arrG)"/>
  <text x="285" y="300" font-size="12" fill="#f2c200" font-weight="bold">attacker carries the ball at speed</text>

  <!-- Shot -->
  <path d="M262,135 L260,82" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 5" fill="none" marker-end="url(#arrW)"/>
  <text x="275" y="118" font-size="12" fill="#ffffff">finishes: 1st goal</text>

  <text x="260" y="500" text-anchor="middle" font-size="12" fill="#444444">Schematic, not to scale. Morocco attacking towards the top goal. Red = Morocco. Gold = attacker. White = Spain.</text>
</svg>
