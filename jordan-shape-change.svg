<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2c200"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Morocco vs Jordan: how the defensive shape changed</text>

  <!-- Panel 1: 4-4-2 look -->
  <g transform="translate(10,45)">
    <rect width="300" height="350" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="10" x2="300" y2="10" stroke="#ffffff" stroke-width="2"/>
    <rect x="75" y="270" width="150" height="80" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="115" y="320" width="70" height="30" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="150" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4-4-2 look</text>
    <g fill="#c1272d" stroke="#ffffff" stroke-width="2">
      <circle cx="150" cy="335" r="11"/>
      <circle cx="40" cy="255" r="11"/><circle cx="115" cy="255" r="11"/><circle cx="185" cy="255" r="11"/><circle cx="260" cy="255" r="11"/>
      <circle cx="40" cy="185" r="11"/><circle cx="115" cy="185" r="11"/><circle cx="185" cy="185" r="11"/><circle cx="260" cy="185" r="11"/>
      <circle cx="110" cy="115" r="11"/><circle cx="190" cy="115" r="11"/>
    </g>
  </g>

  <!-- Panel 2: 5-3-2 look -->
  <g transform="translate(330,45)">
    <rect width="300" height="350" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="10" x2="300" y2="10" stroke="#ffffff" stroke-width="2"/>
    <rect x="75" y="270" width="150" height="80" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="115" y="320" width="70" height="30" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="150" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5-3-2 look (about 30:00)</text>
    <g fill="#c1272d" stroke="#ffffff" stroke-width="2">
      <circle cx="150" cy="335" r="11"/>
      <circle cx="30" cy="255" r="11"/><circle cx="90" cy="255" r="11"/><circle cx="150" cy="255" r="11"/><circle cx="210" cy="255" r="11"/>
      <circle cx="80" cy="185" r="11"/><circle cx="150" cy="185" r="11"/><circle cx="220" cy="185" r="11"/>
      <circle cx="110" cy="115" r="11"/><circle cx="190" cy="115" r="11"/>
    </g>
    <circle cx="270" cy="255" r="11" fill="#f2c200" stroke="#ffffff" stroke-width="2"/>
    <path d="M270,195 L270,238" stroke="#f2c200" stroke-width="3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
    <text x="262" y="180" text-anchor="end" font-size="12" fill="#f2c200" font-weight="bold">full-back drops in</text>
  </g>

  <text x="320" y="418" text-anchor="middle" font-size="12" fill="#444444">Schematic, not to scale. Morocco defending, own goal at the bottom. Morocco started in a 4-3-3.</text>
  <text x="320" y="434" text-anchor="middle" font-size="12" fill="#444444">Red = Morocco players. Gold = the full-back who dropped into the back line.</text>
</svg>
