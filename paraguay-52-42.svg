<svg viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2c200"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd0d0"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="520" height="480" fill="#ffffff"/>
  <text x="260" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">Morocco vs Paraguay, 52:42: wide attack with central support</text>

  <rect x="10" y="40" width="500" height="390" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/>
  <rect x="140" y="40" width="240" height="110" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="215" y="40" width="90" height="35" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="240" y="33" width="40" height="7" fill="#ffffff"/>

  <!-- Paraguay defenders recovering -->
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="180" cy="178" r="11"/><circle cx="240" cy="172" r="11"/><circle cx="305" cy="172" r="11"/><circle cx="365" cy="185" r="11"/>
  </g>
  <text x="160" y="205" font-size="12" fill="#ffffff">Paraguay defenders recovering</text>

  <!-- Central runner -->
  <circle cx="270" cy="320" r="11" fill="#c1272d" stroke="#ffffff" stroke-width="2"/>
  <path d="M270,305 L270,215" stroke="#ffd0d0" stroke-width="3" stroke-dasharray="6 4" fill="none" marker-end="url(#arrR)"/>
  <text x="282" y="325" font-size="12" fill="#ffffff">runs through the centre</text>

  <!-- Two runners entering the box -->
  <circle cx="200" cy="250" r="11" fill="#c1272d" stroke="#ffffff" stroke-width="2"/>
  <path d="M200,235 L200,110" stroke="#ffd0d0" stroke-width="3" stroke-dasharray="6 4" fill="none" marker-end="url(#arrR)"/>
  <circle cx="335" cy="250" r="11" fill="#c1272d" stroke="#ffffff" stroke-width="2"/>
  <path d="M335,235 L335,100" stroke="#ffd0d0" stroke-width="3" stroke-dasharray="6 4" fill="none" marker-end="url(#arrR)"/>
  <text x="270" y="100" text-anchor="middle" font-size="12" fill="#ffffff">two players enter the box</text>

  <!-- Ball carrier wide route -->
  <circle cx="455" cy="390" r="12" fill="#f2c200" stroke="#ffffff" stroke-width="2"/>
  <path d="M455,375 C 455,300 420,240 385,160" stroke="#f2c200" stroke-width="4" fill="none" marker-end="url(#arrG)"/>
  <text x="498" y="345" text-anchor="end" font-size="12" fill="#f2c200" font-weight="bold">ball carrier goes wide</text>
  <text x="498" y="361" text-anchor="end" font-size="12" fill="#f2c200" font-weight="bold">after winning the ball</text>

  <!-- Shot -->
  <path d="M385,150 L285,50" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 5" fill="none" marker-end="url(#arrW)"/>
  <text x="396" y="130" font-size="12" fill="#ffffff">shot, then a teammate</text>
  <text x="396" y="144" font-size="12" fill="#ffffff">finishes: 2nd goal</text>

  <text x="260" y="452" text-anchor="middle" font-size="12" fill="#444444">Schematic, not to scale. Morocco attacking towards the top goal.</text>
  <text x="260" y="468" text-anchor="middle" font-size="12" fill="#444444">Red = Morocco. Gold = ball carrier. White = Paraguay.</text>
</svg>
